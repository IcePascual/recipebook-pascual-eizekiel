{% extends 'base.html' %}

{% block title %}Recipe Book{% endblock %}
{% block pagetitle %}Recipe Creation{% endblock %}

{% block content %}
    {% if request.user.is_authenticated %}
        <a href="{% url 'ledger:recipe' pk %}">Return to recipe</a>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form }}
            <button type="submit">Add Image</button>
        </form>
    {% endif %}
{% endblock %}
