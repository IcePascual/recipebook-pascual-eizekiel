{% extends 'base.html' %}

{% block title %}Recipe Book{% endblock %}
{% block pagetitle %}Recipe List{% endblock %}

{% block content %}
    <a href="{% url 'ledger:recipe_create' %}">Add a new recipe</a>
    <ol>
        {% for recipe in object_list %}
        <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
        {% endfor %}
    </ol>
{% endblock %}
